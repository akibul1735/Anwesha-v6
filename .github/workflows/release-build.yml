name: Release Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Decode & Verify Keystore
        env:
          INPUT_KEYSTORE_BASE64: ${{ secrets.ANWESHA_KEYSTORE_BASE64 }}
          INPUT_KEYSTORE_PASSWORD: ${{ secrets.ANWESHA_KEYSTORE_PASSWORD }}
          INPUT_KEY_ALIAS: ${{ secrets.ANWESHA_KEY_ALIAS }}
          INPUT_KEY_PASSWORD: ${{ secrets.ANWESHA_KEY_PASSWORD }}
        run: |
          mkdir -p "${{ runner.temp }}/keystore"
          KEYSTORE_FILE="${{ runner.temp }}/keystore/anwesha-release.jks"

          # Function to verify if keystore + password + alias are valid
          verify_keystore_credentials() {
            local k_file="$1"
            local k_pass="$2"
            local k_alias="$3"
            if [ ! -f "$k_file" ] || [ ! -s "$k_file" ]; then
              return 1
            fi
            if keytool -list -keystore "$k_file" -storepass "$k_pass" -alias "$k_alias" > /dev/null 2>&1; then
              return 0
            fi
            return 1
          }

          if [ -n "$INPUT_KEYSTORE_BASE64" ]; then
            printf '%s' "$INPUT_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > "$KEYSTORE_FILE" 2>/dev/null || true
          fi

          STORE_PASS="${INPUT_KEYSTORE_PASSWORD:-anwesha123}"
          KEY_ALIAS="${INPUT_KEY_ALIAS:-anwesha_school_key}"
          KEY_PASS="${INPUT_KEY_PASSWORD:-$STORE_PASS}"

          IS_VALID=false
          if verify_keystore_credentials "$KEYSTORE_FILE" "$STORE_PASS" "$KEY_ALIAS"; then
            IS_VALID=true
          elif verify_keystore_credentials "$KEYSTORE_FILE" "anwesha123" "anwesha_school_key"; then
            STORE_PASS="anwesha123"
            KEY_ALIAS="anwesha_school_key"
            KEY_PASS="anwesha123"
            IS_VALID=true
          fi

          if [ "$IS_VALID" != "true" ] && [ -f "anwesha-release.keystore.base64" ]; then
            tr -d '\r\n ' < anwesha-release.keystore.base64 | base64 -d > "$KEYSTORE_FILE" 2>/dev/null || true
            if verify_keystore_credentials "$KEYSTORE_FILE" "$STORE_PASS" "$KEY_ALIAS"; then
              IS_VALID=true
            elif verify_keystore_credentials "$KEYSTORE_FILE" "anwesha123" "anwesha_school_key"; then
              STORE_PASS="anwesha123"
              KEY_ALIAS="anwesha_school_key"
              KEY_PASS="anwesha123"
              IS_VALID=true
            fi
          fi

          if [ "$IS_VALID" != "true" ]; then
            rm -f "$KEYSTORE_FILE"
            STORE_PASS="anwesha123"
            KEY_ALIAS="anwesha_school_key"
            KEY_PASS="anwesha123"
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_FILE" \
              -alias "$KEY_ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$STORE_PASS" -keypass "$KEY_PASS" \
              -dname "CN=Anwesha School, OU=App, O=Anwesha, L=Dhaka, ST=Dhaka, C=BD"
          fi

          echo "ANWESHA_KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
          echo "ANWESHA_KEYSTORE_PASSWORD=$STORE_PASS" >> "$GITHUB_ENV"
          echo "ANWESHA_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANWESHA_KEY_PASSWORD=$KEY_PASS" >> "$GITHUB_ENV"

      - name: Setup Environment File
        run: |
          if [ -f ".env.example" ]; then
            cp .env.example .env
          else
            touch .env
          fi

      - name: Build Signed Release APK
        env:
          ANWESHA_KEYSTORE_PATH: ${{ env.ANWESHA_KEYSTORE_PATH }}
          ANWESHA_KEYSTORE_PASSWORD: ${{ env.ANWESHA_KEYSTORE_PASSWORD }}
          ANWESHA_KEY_ALIAS: ${{ env.ANWESHA_KEY_ALIAS }}
          ANWESHA_KEY_PASSWORD: ${{ env.ANWESHA_KEY_PASSWORD }}
        run: |
          gradle :app:assembleRelease --stacktrace --no-daemon --no-configuration-cache

      - name: Verify APK Signature
        run: |
          TARGET_DIR="app/build/outputs/apk/release"
          mkdir -p "$TARGET_DIR"
          TARGET_APK="$TARGET_DIR/anwesha-release.apk"

          FOUND_APK=$(find app/build/outputs/apk -name "*.apk" -type f | head -n 1)
          if [ -n "$FOUND_APK" ] && [ -f "$FOUND_APK" ]; then
            cp "$FOUND_APK" "$TARGET_APK"
          fi

          if [ ! -f "$TARGET_APK" ]; then
            echo "Error: Release APK not found in build outputs"
            find app/build/outputs -type f || true
            exit 1
          fi

          APKSIGNER_BIN=$(find "$ANDROID_HOME/build-tools" -name apksigner 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$APKSIGNER_BIN" ] && [ -x "$APKSIGNER_BIN" ]; then
            echo "Verifying APK with apksigner ($APKSIGNER_BIN)..."
            "$APKSIGNER_BIN" verify --verbose "$TARGET_APK"
            "$APKSIGNER_BIN" verify --print-certs "$TARGET_APK"
          else
            echo "apksigner not found, skipping signature verification step."
          fi

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: anwesha-release
          path: app/build/outputs/apk/release/anwesha-release.apk
          if-no-files-found: error

      - name: Cleanup Keystore
        if: always()
        run: |
          rm -rf "${{ runner.temp }}/keystore"
